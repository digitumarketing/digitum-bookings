name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: mbstring, intl, pdo_sqlite
          coverage: pcov
          tools: composer:v2

      - run: composer install --no-interaction --no-progress

      - name: Coding standards
        run: composer lint

      - name: Unit tests (pricing engine must stay at 100% coverage)
        run: composer test:coverage

  integration:
    runs-on: ubuntu-24.04
    services:
      # Stripe's official mock: checks every Stripe request the plugin makes against Stripe's API schema.
      stripe-mock:
        image: stripe/stripe-mock:v0.206.0
        ports:
          - 12111:12111
    strategy:
      matrix:
        wordpress: ['6.5.5', '7.1.3']
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: mbstring, intl, pdo_sqlite
          tools: composer:v2

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - run: composer install --no-interaction --no-progress
      - run: npm install --no-audit --no-fund && npm run build

      - name: Download WordPress and the SQLite driver
        run: |
          git clone --quiet --depth 1 --branch ${{ matrix.wordpress }} https://github.com/WordPress/WordPress.git .wp-test/wordpress
          git clone --quiet --depth 1 --branch v2.1.16 https://github.com/WordPress/sqlite-database-integration.git .wp-test/sqlite

      - name: Previous release (for the upgrade test)
        run: |
          PREVIOUS=$(git tag --list 'v*' --sort=-v:refname | grep -vx "${GITHUB_REF_NAME}" | head -n 1)
          if [ -n "$PREVIOUS" ]; then
            git worktree add --quiet .wp-test/previous "$PREVIOUS"
            echo "DGB_PREVIOUS_DIR=$GITHUB_WORKSPACE/.wp-test/previous" >> "$GITHUB_ENV"
          fi

      # Current Rank Math and Yoast need WordPress 6.7+. Built from their repositories; if that ever fails the
      # schema merge scenario (J) is skipped and the rest still runs.
      - name: Rank Math and Yoast SEO (schema merge test)
        if: matrix.wordpress != '6.5.5'
        continue-on-error: true
        run: |
          git clone --quiet --depth 1 https://github.com/rankmath/seo-by-rank-math.git .wp-test/seo/rank-math
          composer dump-autoload --no-dev --no-scripts --working-dir=.wp-test/seo/rank-math
          git clone --quiet --depth 1 https://github.com/Yoast/wordpress-seo.git .wp-test/seo/yoast
          php -r '$f = ".wp-test/seo/yoast/composer.json"; $c = json_decode( file_get_contents( $f ), true ); foreach ( array_keys( $c["require-dev"] ) as $k ) { if ( str_starts_with( $k, "wpackagist" ) ) { unset( $c["require-dev"][ $k ] ); } } unset( $c["repositories"] ); file_put_contents( $f, json_encode( $c, JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES ) );'
          composer update --no-interaction --no-progress --working-dir=.wp-test/seo/yoast wpackagist-plugin/easy-digital-downloads wpackagist-plugin/google-site-kit wpackagist-plugin/woocommerce
          echo "DGB_RANKMATH_DIR=$GITHUB_WORKSPACE/.wp-test/seo/rank-math" >> "$GITHUB_ENV"
          echo "DGB_YOAST_DIR=$GITHUB_WORKSPACE/.wp-test/seo/yoast" >> "$GITHUB_ENV"

      - name: WordPress tests (activation, pricing, holds, concurrency, upgrade, booking flow, payments, admin, integrations)
        run: composer test:integration
        env:
          DGB_WP_DIR: .wp-test/wordpress
          DGB_SQLITE_DIR: .wp-test/sqlite
          DGB_STRIPE_MOCK: http://localhost:12111

      - name: Update from one release to the next (release build, fake GitHub API)
        run: |
          composer build
          DGB_SCENARIOS=K DGB_PLUGIN_DIR="$GITHUB_WORKSPACE/build/digitum-bookings" composer test:integration
        env:
          DGB_WP_DIR: .wp-test/wordpress
          DGB_SQLITE_DIR: .wp-test/sqlite

  e2e:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: mbstring, intl, pdo_sqlite
          tools: composer:v2

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - run: composer install --no-interaction --no-progress --no-dev
      - run: npm install --no-audit --no-fund && npm run build
      - run: npx playwright install --with-deps chromium

      - name: Download WordPress and the SQLite driver
        run: |
          git clone --quiet --depth 1 --branch 6.5.5 https://github.com/WordPress/WordPress.git .wp-test/wordpress
          git clone --quiet --depth 1 --branch v2.1.16 https://github.com/WordPress/sqlite-database-integration.git .wp-test/sqlite

      - name: Browser tests (desktop and phone, axe)
        run: npm run test:e2e
        env:
          DGB_WP_DIR: .wp-test/wordpress
          DGB_SQLITE_DIR: .wp-test/sqlite

      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: playwright-results
          path: test-results/
